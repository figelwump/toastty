<!doctype html>
<!-- 1200x630 social preview card for toastty.dev, rendered by render-hero-video.mjs --social.
     It reuses the site's stylesheet and places the video's poster frame beside the tagline. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap">
<link rel="stylesheet" href="../../website/styles.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
  .card { position: relative; height: 630px; padding: 64px 0 0 64px; }
  .card .brand { font-size: 22px; gap: 12px; }
  .card .brand svg { width: 40px; height: 40px; }
  .card .eyebrow { margin-top: 64px; font-size: 14px; }
  .card h1 { text-align: left; margin: 16px 0 0; font-size: 80px; max-width: none; }
  /* A close-up of the poster's sidebar, large enough that the ready row and PR chip stay
     readable when the card is shown about 500px wide. */
  .card .shot { position: absolute; right: 64px; top: 56px; width: 470px; height: 518px; overflow: hidden; border-radius: 16px; background: #1b1b1d; box-shadow: 0 30px 70px -24px rgba(60, 35, 5, 0.55); }
  .card .shot img { position: absolute; transform-origin: 0 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ic-crust" x1="512" y1="184" x2="512" y2="804" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffbf54"/><stop offset="0.42" stop-color="#f4a62d"/><stop offset="1" stop-color="#8a4a08"/></linearGradient>
    <linearGradient id="ic-bread" x1="512" y1="274" x2="512" y2="732" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff8e9"/><stop offset="0.58" stop-color="#f7e6bd"/><stop offset="1" stop-color="#e6cc93"/></linearGradient>
  </defs>
  <symbol id="icon-toast" viewBox="170 190 684 660">
    <path d="M226 746V472C190 442 180 379 203 328C235 254 322 218 512 218C702 218 789 254 821 328C844 379 834 442 798 472V746C798 790 758 813 512 813C266 813 226 790 226 746Z" fill="url(#ic-crust)"/>
    <path d="M305 704V469C276 446 268 397 286 359C311 306 379 281 512 281C645 281 713 306 738 359C756 397 748 446 719 469V704C719 734 692 749 512 749C332 749 305 734 305 704Z" fill="url(#ic-bread)"/>
    <g stroke="#2a1408" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M372 435L496 522L372 609" stroke-width="50"/><path d="M556 614H664" stroke-width="46"/></g>
  </symbol>
</svg>
<div class="card">
  <div class="brand"><svg aria-hidden="true"><use href="#icon-toast"/></svg><span>Toastty</span></div>
  <div class="eyebrow">A native macOS terminal multiplexer<br>for coding agents</div>
  <h1>Any agent.<em>Any workflow.</em></h1>
  <div class="shot"><img alt=""></div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const [x, y, w, h] = params.get('crop').split(',').map(Number);
  const box = document.querySelector('.shot');
  const img = box.querySelector('img');
  // Scale the crop to fill the box width (or height, whichever is tighter), anchored top-left.
  const scale = Math.min(box.clientWidth / w, box.clientHeight / h);
  img.style.transform = `translate(${-x * scale}px, ${-y * scale}px) scale(${scale})`;
  img.src = params.get('poster');
</script>
</body>
</html>
