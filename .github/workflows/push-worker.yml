name: Push Worker checks

on:
  pull_request:
    paths: ['workers/push/**', '.github/workflows/push-worker.yml']
  push:
    branches: [main]
    paths: ['workers/push/**', '.github/workflows/push-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: workers/push/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx wrangler deploy --dry-run
      - run: npx wrangler deploy --dry-run --config wrangler.relay.jsonc
