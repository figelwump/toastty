name: Toastty CI

# Pull requests run only the Linux workflow tests and the CI gate, which branch
# protection on main requires. The test jobs run only on manual dispatch:
#   gh workflow run mobile-ios.yml --ref <branch>
on:
  pull_request:
  workflow_dispatch:

# New PR commits cancel superseded checks. Manual full validations keep distinct
# groups so each requested source can finish and retain release evidence.
concurrency:
  group: mobile-ios-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow:
    name: CI workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Test CI workflow and gate
        run: |
          npm ci --prefix Tests/CI --no-audit --no-fund
          npm test --prefix Tests/CI

  ios:
    name: iOS tests (${{ matrix.configuration }})
    needs: workflow
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: ${{ matrix.configuration == 'Debug' && 150 || 45 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      TOASTTY_IOS_CONFIGURATION: ${{ matrix.configuration }}
      TOASTTY_IOS_WORKTREE_ID: mobile-ci
      TOASTTY_IOS_RUN_ROOT: ${{ github.workspace }}/artifacts/ios/run
      TOASTTY_IOS_DERIVED_DATA_PATH: ${{ github.workspace }}/artifacts/ios/DerivedData
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Select pinned iOS Xcode
        run: bash scripts/ci/select-ios-xcode.sh

      - name: Install pinned Tuist
        run: |
          brew install mise
          TUIST_VERSION="$(awk '$1 == "tuist" { print $2 }' .tool-versions)"
          mise install "tuist@$TUIST_VERSION" --quiet
          TUIST_BIN_DIR="$(dirname "$(mise exec "tuist@$TUIST_VERSION" -- which tuist)")"
          echo "$TUIST_BIN_DIR" >> "$GITHUB_PATH"
          test "$("$TUIST_BIN_DIR/tuist" version)" = "$TUIST_VERSION"

      - name: Test native client
        # Explicit validation includes the full UI suite and performance budgets.
        # Hosted runners can time out the first UI launch under load, so every
        # failed test gets one more attempt; the uploaded xcresult keeps both.
        run: node ios/scripts/toastty-ios.mjs test --retry-tests-on-failure

      - name: Upload iOS test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-tests-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios/
          if-no-files-found: warn
          retention-days: 14

  macos:
    name: macOS contract tests
    needs: workflow
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ARCH: arm64
      TUIST_DISABLE_GHOSTTY: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install pinned Tuist
        run: |
          brew install mise
          TUIST_VERSION="$(awk '$1 == "tuist" { print $2 }' .tool-versions)"
          mise install "tuist@$TUIST_VERSION" --quiet
          TUIST_BIN_DIR="$(dirname "$(mise exec "tuist@$TUIST_VERSION" -- which tuist)")"
          echo "$TUIST_BIN_DIR" >> "$GITHUB_PATH"
          test "$("$TUIST_BIN_DIR/tuist" version)" = "$TUIST_VERSION"

      - name: Test Mac push build configuration
        run: node --test Tests/BuildConfig/PushManifestTests.mjs

      - name: Test Mac release and device scripts
        run: node --test ios/Tests/ReleaseScriptTests/ios-testflight.test.mjs ios/Tests/ScriptTests/validate-device-build.test.mjs

      - name: Generate macOS project
        run: TUIST_TOASTTY_DISABLE_PUSH=1 ./scripts/dev/bootstrap-worktree.sh

      - name: Test macOS contract
        run: |
          xcodebuild \
            -workspace toastty.xcworkspace \
            -scheme ToasttyApp \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath artifacts/ci-macos/Derived \
            -resultBundlePath artifacts/ci-macos/TestResults.xcresult \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            test

      - name: Build unsigned macOS Release app
        run: |
          xcodebuild \
            -workspace toastty.xcworkspace \
            -scheme ToasttyApp \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath artifacts/ci-macos/Derived \
            -resultBundlePath artifacts/ci-macos/ReleaseBuild.xcresult \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload macOS test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-contract-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-macos/*.xcresult
          if-no-files-found: warn
          retention-days: 14

  scripts:
    name: Script tests
    needs: workflow
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Test portable dispatcher, release evidence, and remote runner contracts
        run: >-
          node --test
          ios/Tests/ScriptTests/native-device.test.mjs
          ios/Tests/ScriptTests/physical-device.test.mjs
          ios/Tests/ScriptTests/toastty-ios.test.mjs
          ios/Tests/ReleaseScriptTests/require-ios-ci.test.mjs
          ios/Tests/ReleaseScriptTests/select-ios-xcode.test.mjs
          Tests/RemoteScripts/*Tests.mjs

  web:
    name: Web panel tests
    needs: workflow
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Test web panels and generated bundles
        run: |
          for panel in WebPanels/LocalDocumentApp WebPanels/ScratchpadApp; do
            npm ci --prefix "$panel" --no-audit --no-fund
            npm test --prefix "$panel"
          done

  gate:
    name: CI gate
    if: always()
    needs:
      - workflow
      - ios
      - macos
      - scripts
      - web
    runs-on: ubuntu-latest
    steps:
      - name: Require the workflow tests, and every job on a full run
        env:
          WORKFLOW_RESULT: ${{ needs.workflow.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          SCRIPTS_RESULT: ${{ needs.scripts.result }}
          WEB_RESULT: ${{ needs.web.result }}
          FULL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          test "$WORKFLOW_RESULT" = success
          expected=skipped
          if [[ "$FULL_RUN" == true ]]; then expected=success; fi
          for result in "$IOS_RESULT" "$MACOS_RESULT" "$SCRIPTS_RESULT" "$WEB_RESULT"; do
            test "$result" = "$expected"
          done
