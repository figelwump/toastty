name: Toastty CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer PR push supersedes the older run. Pushes to main and manual runs group by
# commit so each one runs to completion and every merged commit is tested.
concurrency:
  group: mobile-ios-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select build graphs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      macos: ${{ steps.filter.outputs.macos }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Test CI selection and gate
        run: |
          npm ci --prefix Tests/CI --no-audit --no-fund
          npm test --prefix Tests/CI

      - name: Select affected graphs
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: .github/ci-paths.yml

  ios:
    name: iOS tests (${{ matrix.configuration }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      TOASTTY_IOS_CONFIGURATION: ${{ matrix.configuration }}
      TOASTTY_IOS_WORKTREE_ID: mobile-ci
      TOASTTY_IOS_RUN_ROOT: ${{ github.workspace }}/artifacts/ios/run
      TOASTTY_IOS_DERIVED_DATA_PATH: ${{ github.workspace }}/artifacts/ios/DerivedData
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install pinned Tuist
        run: |
          brew install mise
          TUIST_VERSION="$(awk '$1 == "tuist" { print $2 }' .tool-versions)"
          mise install "tuist@$TUIST_VERSION" --quiet
          TUIST_BIN_DIR="$(dirname "$(mise exec "tuist@$TUIST_VERSION" -- which tuist)")"
          echo "$TUIST_BIN_DIR" >> "$GITHUB_PATH"
          test "$("$TUIST_BIN_DIR/tuist" version)" = "$TUIST_VERSION"

      - name: Test dispatcher and release scripts
        run: node --test ios/Tests/ScriptTests/*.test.mjs ios/Tests/ReleaseScriptTests/*.test.mjs

      - name: Test native client
        run: node ios/scripts/toastty-ios.mjs test

      - name: Upload iOS test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-tests-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios/
          if-no-files-found: warn
          retention-days: 14

  macos:
    name: macOS contract tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ARCH: arm64
      TUIST_DISABLE_GHOSTTY: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Tuist
        run: |
          brew install mise
          TUIST_VERSION="$(awk '$1 == "tuist" { print $2 }' .tool-versions)"
          mise install "tuist@$TUIST_VERSION" --quiet
          TUIST_BIN_DIR="$(dirname "$(mise exec "tuist@$TUIST_VERSION" -- which tuist)")"
          echo "$TUIST_BIN_DIR" >> "$GITHUB_PATH"
          test "$("$TUIST_BIN_DIR/tuist" version)" = "$TUIST_VERSION"

      - name: Generate macOS project
        run: ./scripts/dev/bootstrap-worktree.sh

      - name: Test macOS contract
        run: |
          xcodebuild \
            -workspace toastty.xcworkspace \
            -scheme ToasttyApp \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath artifacts/ci-macos/Derived \
            -resultBundlePath artifacts/ci-macos/TestResults.xcresult \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            test

      - name: Build unsigned macOS Release app
        run: |
          xcodebuild \
            -workspace toastty.xcworkspace \
            -scheme ToasttyApp \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath artifacts/ci-macos/Derived \
            -resultBundlePath artifacts/ci-macos/ReleaseBuild.xcresult \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload macOS test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-contract-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-macos/*.xcresult
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web panel tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Test web panels and generated bundles
        run: |
          for panel in WebPanels/LocalDocumentApp WebPanels/ScratchpadApp; do
            npm ci --prefix "$panel" --no-audit --no-fund
            npm test --prefix "$panel"
          done

  gate:
    name: Mobile iOS gate
    if: always()
    needs:
      - changes
      - ios
      - macos
      - web
    runs-on: ubuntu-latest
    steps:
      - name: Require selected graph checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WEB_RESULT: ${{ needs.web.result }}
          IOS_SELECTED: ${{ needs.changes.outputs.ios }}
          MACOS_SELECTED: ${{ needs.changes.outputs.macos }}
          WEB_SELECTED: ${{ needs.changes.outputs.web }}
          FULL_RUN: ${{ github.event_name != 'pull_request' }}
        run: |
          test "$CHANGES_RESULT" = success
          require_result() {
            if [[ "$FULL_RUN" == true || "$1" == true ]]; then
              test "$2" = success
            else
              case "$2" in success|skipped) ;; *) return 1 ;; esac
            fi
          }
          require_result "$IOS_SELECTED" "$IOS_RESULT"
          require_result "$MACOS_SELECTED" "$MACOS_RESULT"
          require_result "$WEB_SELECTED" "$WEB_RESULT"
