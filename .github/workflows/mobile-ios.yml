name: Entry scroll diagnostics

on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS tests (${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug]
    env:
      TOASTTY_IOS_CONFIGURATION: ${{ matrix.configuration }}
      TOASTTY_IOS_WORKTREE_ID: mobile-ci
      TOASTTY_IOS_RUN_ROOT: ${{ github.workspace }}/artifacts/ios/run
      TOASTTY_IOS_DERIVED_DATA_PATH: ${{ github.workspace }}/artifacts/ios/DerivedData
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Select pinned iOS Xcode
        run: bash scripts/ci/select-ios-xcode.sh

      - name: Install pinned Tuist
        run: |
          brew install mise
          TUIST_VERSION="$(awk '$1 == "tuist" { print $2 }' .tool-versions)"
          mise install "tuist@$TUIST_VERSION" --quiet
          TUIST_BIN_DIR="$(dirname "$(mise exec "tuist@$TUIST_VERSION" -- which tuist)")"
          echo "$TUIST_BIN_DIR" >> "$GITHUB_PATH"
          test "$("$TUIST_BIN_DIR/tuist" version)" = "$TUIST_VERSION"

      - name: Test dispatcher and release scripts
        run: node --test ios/Tests/ScriptTests/*.test.mjs ios/Tests/ReleaseScriptTests/*.test.mjs

      - name: Test native client
        # Full UI and hardware-sensitive budgets remain available on manual runs.
        # Hosted runners can time out the first UI launch under load, so every
        # failed test gets one more attempt; the uploaded xcresult keeps both.
        run: |
          if [[ "$TOASTTY_IOS_CONFIGURATION" == Debug ]]; then
            node ios/scripts/toastty-ios.mjs generate
            xcodebuild -workspace ios/ToasttyMobile.xcworkspace -scheme ToasttyMobileApp -configuration Debug -parallel-testing-enabled NO -test-iterations 1 -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -derivedDataPath artifacts/ios/DerivedData -resultBundlePath artifacts/ios/EntryTrace.xcresult -only-testing:ToasttyMobileUITests/ToasttyMobileFixtureUITests/testReadyResponseInLongHistoryShowsPrecedingContext -only-testing:ToasttyMobileUITests/ToasttyMobileFixtureUITests/testReadyResponseOpensWithItsCollapsedWorkCardAboveIt test ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          else
            node ios/scripts/toastty-ios.mjs test --skip-performance-budgets
          fi

      - name: Upload iOS test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-tests-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios/
          if-no-files-found: warn
          retention-days: 14
