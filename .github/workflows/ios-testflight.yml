name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the validated IPA to App Store Connect
        required: true
        type: boolean
        default: false
      source_sha:
        description: Full 40-character SHA of a commit on main to build. Leave empty to build the commit this run starts from.
        required: false
        type: string
        default: ''
      ci_override_reason:
        description: Emergency only. Text here skips the full CI check for this build and records the reason. Leave empty.
        required: false
        type: string
        default: ''

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Validate or Upload
    environment: testflight
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read

    steps:
      # The workflow file comes from the dispatched ref; the build can be an
      # earlier commit on main, such as a release commit that main moved past.
      - name: Resolve release source
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          sha="${REQUESTED_SHA:-$EVENT_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full 40-character lowercase commit SHA." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Require release source on main
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "The release source $SOURCE_SHA is not on main." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Require main for upload
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload && github.ref != 'refs/heads/main' }}
        run: |
          echo "TestFlight uploads are allowed only from main." >&2
          exit 1

      - name: Require trusted CI for the release source
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          CI_OVERRIDE_REASON: ${{ inputs.ci_override_reason }}
        # Run the gate from the dispatched commit, not from the commit it checks:
        # an earlier commit on main can carry an older or weaker gate.
        run: |
          gate="$RUNNER_TEMP/release-gate"
          mkdir -p "$gate/scripts/ci" "$gate/.github"
          git fetch --no-tags origin "$GATE_SHA"
          git show "$GATE_SHA:scripts/ci/require-ios-ci.mjs" > "$gate/scripts/ci/require-ios-ci.mjs"
          git show "$GATE_SHA:.github/ios-release-ci-jobs.json" > "$gate/.github/ios-release-ci-jobs.json"
          node "$gate/scripts/ci/require-ios-ci.mjs" --source "$GITHUB_WORKSPACE" --sha "$RELEASE_SHA" \
            --override-reason="$CI_OVERRIDE_REASON" --output artifacts/ios-release/ci-evidence.json

      - name: Select pinned iOS Xcode
        run: bash scripts/ci/select-ios-xcode.sh

      - name: Install pinned Tuist
        run: |
          brew install mise
          TUIST_VERSION="$(awk '$1 == "tuist" { print $2 }' .tool-versions)"
          mise install "tuist@$TUIST_VERSION" --quiet
          TUIST_BIN_DIR="$(dirname "$(mise exec "tuist@$TUIST_VERSION" -- which tuist)")"
          echo "$TUIST_BIN_DIR" >> "$GITHUB_PATH"
          test "$("$TUIST_BIN_DIR/tuist" version)" = "$TUIST_VERSION"

      - name: Test release script
        run: node --test ios/Tests/ReleaseScriptTests/*.test.mjs

      - name: Archive and validate TestFlight build
        env:
          TOASTTY_IOS_VERIFIED_SHA: ${{ steps.ci.outputs.verified_sha }}
          TOASTTY_IOS_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TOASTTY_IOS_CI_GATE: ${{ steps.ci.outputs.gate }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          TOASTTY_IOS_DEVELOPMENT_TEAM: ${{ secrets.TOASTTY_IOS_DEVELOPMENT_TEAM }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_APPSTORE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          TUIST_TOASTTY_MOBILE_PUSH_PRODUCTION_RELAY_URL: ${{ vars.TUIST_TOASTTY_MOBILE_PUSH_PRODUCTION_RELAY_URL }}
          TUIST_TOASTTY_MOBILE_PUSH_PRODUCTION_RELAY_ID: ${{ vars.TUIST_TOASTTY_MOBILE_PUSH_PRODUCTION_RELAY_ID }}
          TUIST_TOASTTY_MOBILE_PUSH_PRODUCTION_ENVIRONMENT: ${{ vars.TUIST_TOASTTY_MOBILE_PUSH_PRODUCTION_ENVIRONMENT }}
          TOASTTY_IOS_UPLOAD: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.upload == true && '1' || '0' }}
        run: bash scripts/ci/ios-testflight.sh

      - name: Upload sanitized release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ios-release/ci-evidence.json
            artifacts/ios-release/**/export/*.ipa
            artifacts/ios-release/**/Toastty.xcarchive.tar.gz
            artifacts/ios-release/**/ExportOptions.plist
            artifacts/ios-release/**/release-metadata.txt
            artifacts/ios-release/**/generate.log
            artifacts/ios-release/**/archive.log
            artifacts/ios-release/**/export.log
            artifacts/ios-release/**/validation.log
            artifacts/ios-release/**/upload.log
          if-no-files-found: warn
          retention-days: 90
